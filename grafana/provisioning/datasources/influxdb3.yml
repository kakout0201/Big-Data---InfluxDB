apiVersion: 1

# Legacy Phase 1 datasource (database server_monitoring); removed together with its dashboard in P8.
deleteDatasources:
  - name: InfluxDB 3 Core
    orgId: 1

datasources:
  - name: InfluxDB 3 Weather
    type: influxdb
    uid: influxdb3_weather
    access: proxy
    url: https://influxdb:8181
    isDefault: true
    editable: false
    jsonData:
      version: SQL
      dbName: ${WEATHER_INFLUXDB_DATABASE}
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
